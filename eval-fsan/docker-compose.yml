services:
  eval-llvm:
    command: /bin/bash
    init: true
    privileged: true
    stdin_open: true
    tty: true
    deploy:
      replicas: 1
    environment:
      PINNED_CORES_START: 0
      PINNED_CORES_END: 10
      PROJECT: llvm
    image: gcr.io/oss-fuzz/llvm:latest
    volumes:
    - /home/ale/ubersandro/oss-fuzz/eval-fsan/fuzzing/llvm:/fuzzing-campaign
